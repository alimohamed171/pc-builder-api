server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: pc-builder-api

  datasource:
    url: jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQL_DATABASE:pc_bundle}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQLUSER:root}
    password: ${MYSQLPASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      # products table already exists (imported from pc_bundle_export.sql).
      # "update" will create the new tables (users, bundles, bundle_items)
      # without touching the existing products table structure/data.
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  ai:
      openai:
        base-url: https://api.groq.com/openai
        api-key: ${GROQ_API_KEY}
        chat:
          options:
            model: llama-3.3-70b-versatile
app:
  jwt:
    secret: ${JWT_SECRET:9f7d2c8e4b1a6d3f5e8c0a7b9d2e4f6a8c1b3d5e7f9a2c4e6b8d0f2a4c6e8b1}
    expiration-ms: ${JWT_EXPIRATION_MS:31536000000}
  bundle:
    default-min-psu-headroom-watts: ${PSU_HEADROOM_WATTS:150}
    default-gpu-draw-watts: ${DEFAULT_GPU_DRAW_WATTS:250}

gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gemini-3.5-flash}
  base-url: https://generativelanguage.googleapis.com/v1beta