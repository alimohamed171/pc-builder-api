server:
  port: ${SERVER_PORT:8088}

spring:
  application:
    name: pc-builder-api

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pc_bundle}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # products table already exists (imported from pc_bundle_export.sql).
      # "update" will create the new tables (users, bundles, bundle_items)
      # without touching the existing products table structure/data.
      ddl-auto: update
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
  bundle:
    default-min-psu-headroom-watts: ${PSU_HEADROOM_WATTS:150}
    default-gpu-draw-watts: ${DEFAULT_GPU_DRAW_WATTS:250}

gemini:
  api-key: ${GEMINI_API_KEY}
  model: ${GEMINI_MODEL:gemini-2.5-flash}
  base-url: https://generativelanguage.googleapis.com/v1beta